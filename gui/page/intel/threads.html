<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Intel</title>
<link rel="stylesheet" href="/intel/intel.css">
<script src="/intel/intel.js" defer></script>
<script src="/intel/threads.js" defer></script>
</head>
<body data-module="threads">
<div class="win">
  <div class="win-head">
    <span class="win-glyph" aria-hidden="true"></span>
    <span class="win-title">Intel</span>
    <span class="win-sub" id="count"></span>
    <button type="button" class="win-btn" data-close title="Close (Esc)" aria-label="Close"><svg viewBox="0 0 10 10"><path d="M1 1l8 8M9 1l-8 8"/></svg></button>
  </div>
  <div class="win-body">
    <ul class="rows" id="rows"></ul>
    <p class="empty" id="empty" hidden>Nothing reported in the last six hours.</p>
    <p class="problem" id="problem" hidden></p>
  </div>
  <div class="win-foot"><span id="updated"></span><span class="grow"></span><span class="brand">EveSynapse</span></div>
</div>
</body>
</html>
