<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Report</title>
<link rel="stylesheet" href="/intel/intel.css">
<link rel="stylesheet" href="/intel/report.css">
<script src="/intel/intel.js" defer></script>
<script src="/intel/report.js" defer></script>
</head>
<body data-module="report">
<div class="win">
  <div class="win-head">
    <span class="win-glyph" aria-hidden="true"></span>
    <span class="win-title" id="title">Report</span>
    <span class="win-sub" id="when"></span>
    <button type="button" class="win-btn" data-close title="Close (Esc)" aria-label="Close"><svg viewBox="0 0 10 10"><path d="M1 1l8 8M9 1l-8 8"/></svg></button>
  </div>
  <div class="win-body" id="body">
    <p class="empty" id="empty">Open a thread to see its report here.</p>
  </div>
</div>
</body>
</html>
