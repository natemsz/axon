name: release

# Pushing a tag v1.2.3 builds axon for each platform and publishes
# a release with the programs and their SHA-256 sums. The EveSynapse
# channels page links to these files by name in the latest release, so
# the names below must not change.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for t in windows/amd64 darwin/arm64 darwin/amd64 linux/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=""
            [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/axon-$os-$arch$ext" .
          done
          (cd dist && sha256sum axon-* > SHA256SUMS)
      # Only a signed release is published: the checksums are signed
      # with the release key (RELEASE_SIGNING_KEY secret, the same key
      # as Storm's), and axonsign refuses to sign with a key whose
      # public half is not committed in release-signing.pub.
      # If the secret is missing or wrong this step fails and no
      # release is created.
      - name: Sign the checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          go run ./cmd/axonsign sign dist/SHA256SUMS
          go run ./cmd/axonsign verify dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
            --title "axon $GITHUB_REF_NAME" \
            --notes "Download the program for your computer and save the axon.json your EveSynapse site gives you next to it. Check a download against SHA256SUMS; SHA256SUMS.sig is the release key's signature over SHA256SUMS (public half in release-signing.pub in the repo)." \
            --generate-notes
          fi

  # Every published release is also mirrored to the project's
  # static mirror (the releases bucket behind cdn.synap6.io):
  # the version's files under axon/v<version>/, the
  # programs under axon/latest/, and the signed
  # checksums at axon/ as the channel pointer. The job
  # steps aside silently until the R2 secrets exist.
  mirror:
    needs: release
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Mirror the release to R2
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_BUCKET" ]; then
            echo "R2 secrets are not set; skipping the mirror."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          EP="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -D dist
          for f in dist/*; do
            aws s3 cp "$f" "s3://$R2_BUCKET/axon/v$VERSION/$(basename "$f")" --endpoint-url "$EP"
          done
          for f in dist/axon-*; do
            aws s3 cp "$f" "s3://$R2_BUCKET/axon/latest/$(basename "$f")" --endpoint-url "$EP"
          done
          aws s3 cp dist/SHA256SUMS "s3://$R2_BUCKET/axon/SHA256SUMS" --endpoint-url "$EP"
          aws s3 cp dist/SHA256SUMS.sig "s3://$R2_BUCKET/axon/SHA256SUMS.sig" --endpoint-url "$EP"
          echo "Mirrored v$VERSION."
