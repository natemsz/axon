name: release

# Pushing a tag v1.2.3 builds axon for each platform and publishes
# a release with the programs and their SHA-256 sums. The EveSynapse
# channels page links to these files by name in the latest release, so
# the names below must not change.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for t in windows/amd64 darwin/arm64 darwin/amd64 linux/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=""
            [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/axon-$os-$arch$ext" .
          done
          (cd dist && sha256sum axon-* > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "axon $GITHUB_REF_NAME" \
            --notes "Download the program for your computer and save the axon.json your EveSynapse site gives you next to it. Check a download against SHA256SUMS." \
            --generate-notes
