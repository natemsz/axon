name: release

# Pushing a tag v1.2.3 builds axon for each platform and publishes
# a release with the programs and their SHA-256 sums. Each program is
# its own installer (internal/install). The EveSynapse channels page
# links to these files by name in the latest release, so the names
# below must not change.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      # The Windows program's details (publisher, product, version),
      # icon and manifest, from winres/. go-winres runs here only, at
      # build time; it is not part of the program.
      - name: Windows resources
        env:
          VERSION: ${{ github.ref_name }}
        run: go run github.com/tc-hib/go-winres@v0.3.3 make --in winres/winres.json --arch amd64 --product-version "$VERSION" --file-version "$VERSION"
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for t in windows/amd64 darwin/arm64 darwin/amd64 linux/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=""; gui=""
            # Windows: a windowed program, with no console window.
            [ "$os" = windows ] && ext=.exe && gui="-H windowsgui"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w $gui -X main.version=$VERSION" \
              -o "dist/axon-$os-$arch$ext" .
          done
          (cd dist && sha256sum axon-* > SHA256SUMS)
      # Only a signed release is published: the checksums are signed
      # with the release key (RELEASE_SIGNING_KEY secret, the same key
      # as Storm's), and axonsign refuses to sign with a key whose
      # public half is not committed in release-signing.pub.
      # If the secret is missing or wrong this step fails and no
      # release is created.
      - name: Sign the checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          go run ./cmd/axonsign sign dist/SHA256SUMS
          go run ./cmd/axonsign verify dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
            --title "axon $GITHUB_REF_NAME" \
            --notes "Download the one file for your computer and run it: it installs EveSynapse Axon (per user, no administrator rights), finds your EVE chat logs, makes the shortcuts, and opens Axon. Running a newer download the same way updates it. Check a download against SHA256SUMS; SHA256SUMS.sig is the release key's signature over SHA256SUMS (public half in release-signing.pub in the repo)." \
            --generate-notes
          fi
